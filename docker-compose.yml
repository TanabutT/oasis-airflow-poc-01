# Base stack: Airflow (LocalExecutor) + Postgres + RustFS (S3) + dbt/Spark images.
# Run through the Makefile (sets HOST_DATA_DIR) or see README.
x-airflow-common: &airflow-common
  build:
    context: .
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.3.2}
      PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
  image: ${AIRFLOW_IMAGE_NAME:-oasis-airflow:3.3.2-python3.12}
  user: "${AIRFLOW_UID:-50000}:0"
  group_add:
    - "${DOCKER_GID:-0}"   # docker group GID, lets Airflow use the socket for DockerOperator
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER:-admin}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in your env file}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in your env file}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    PYTHONPATH: /opt/airflow
    # Host path of ./data. DockerOperator bind-mounts it into the dbt/Spark containers,
    # and the Docker daemon resolves it on the host, so it must be an absolute host path.
    HOST_DATA_DIR: ${HOST_DATA_DIR:?run via make, or export HOST_DATA_DIR=<absolute path to ./data>}
    INGEST_ENGINE: ${INGEST_ENGINE:-polars}
    DBT_IMAGE: oasis-dbt:latest
    SPARK_IMAGE: oasis-spark:latest
    DBT_DUCKDB_PATH: /opt/airflow/data/warehouse/analytics.duckdb
    RUSTFS_ENDPOINT: http://rustfs:9000
    RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in your env file}
    RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in your env file}
    RUSTFS_BUCKET: ${RUSTFS_BUCKET:-oasis-archive}
    BRONZE_BUCKET: bronze
    SILVER_BUCKET: silver
    GOLD_BUCKET: gold
    ICEBERG_CATALOG_URI: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/iceberg_catalog
    ICEBERG_NAMESPACE: ${ICEBERG_NAMESPACE:-analytics}
    API_BASE_URL: ${API_BASE_URL:-}
    API_TOKEN: ${API_TOKEN:-}
    API_ORDERS_PATH: ${API_ORDERS_PATH:-/orders}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - airflow-auth:/opt/airflow/auth
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:${RUSTFS_IMAGE_TAG:-1.0.1}
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in your env file}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in your env file}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  # Creates the medallion buckets (bronze/silver/gold) plus the legacy archive bucket.
  # Uses the Airflow image (already has s3fs via pyiceberg[s3fs]), because the minio/mc image is not publicly pullable.
  rustfs-init:
    image: ${AIRFLOW_IMAGE_NAME:-oasis-airflow:3.3.2-python3.12}
    pull_policy: never
    depends_on:
      - rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in your env file}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in your env file}
      RUSTFS_BUCKETS: bronze silver gold ${RUSTFS_BUCKET:-oasis-archive}
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, time, s3fs
        fs = s3fs.S3FileSystem(
            key=os.environ["RUSTFS_ACCESS_KEY"],
            secret=os.environ["RUSTFS_SECRET_KEY"],
            client_kwargs={"endpoint_url": "http://rustfs:9000"},
        )
        for _ in range(60):
            try:
                for bucket in os.environ["RUSTFS_BUCKETS"].split():
                    if not fs.exists(bucket):
                        fs.mkdir(bucket)
                    print("bucket ready:", bucket)
                break
            except Exception as exc:
                print("waiting for rustfs:", exc)
                time.sleep(2)
        else:
            raise SystemExit("rustfs not reachable")

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs /opt/airflow/auth
        printf '{"%s": "%s"}' "$${AIRFLOW_ADMIN_USER}" "$${AIRFLOW_ADMIN_PASSWORD}" > /opt/airflow/auth/passwords.json
        chown -R ${AIRFLOW_UID:-50000}:0 /opt/airflow/logs /opt/airflow/auth
        export HOME=/home/airflow
        exec setpriv --reuid=${AIRFLOW_UID:-50000} --regid=0 --clear-groups airflow db migrate
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in your env file}
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped

  # Image-only services (built, then launched by the DAG). Enable with --profile tools.
  dbt:
    build:
      context: ./dbt
    image: oasis-dbt:latest
    profiles: ["tools"]
    environment:
      DBT_DUCKDB_PATH: /opt/airflow/data/warehouse/analytics.duckdb
    volumes:
      - ./data:/opt/airflow/data

  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: oasis-spark:latest
    profiles: ["tools"]

  # Optional standalone Spark cluster for experiments. Enable with --profile spark-cluster.
  spark-master:
    image: oasis-spark:latest
    pull_policy: never
    profiles: ["spark-cluster"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "8081:8080"

  spark-worker:
    image: oasis-spark:latest
    pull_policy: never
    profiles: ["spark-cluster"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    volumes:
      - ./data:/opt/airflow/data

volumes:
  postgres-db:
  airflow-auth:
  rustfs-data:
